# Reversa - Configuracao do Projeto
# Este arquivo e gerenciado pelo instalador. Para customizacoes, edite config.user.toml

[project]
name = "gestaoescolar"
version = "1.0.0"

[user]
name = "Ewerton"
chat_language = "pt-br"
doc_language = "Portugues"

[output]
folder = "_reversa_sdd"

[agents]
installed = [
  "reversa",
  "reversa-scout",
  "reversa-archaeologist",
  "reversa-detective",
  "reversa-architect",
  "reversa-writer",
  "reversa-reviewer",
  "reversa-visor",
  "reversa-data-master",
  "reversa-design-system",
  "reversa-agents-help",
  "reversa-reconstructor"
]

[engines]
installed = [
  "claude-code",
  "codex",
  "kiro"
]

[analysis]
answer_mode = "chat"
doc_level = "completo"
