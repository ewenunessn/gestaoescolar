openapi: 3.0.3
info:
  title: Guias e Compras API
  version: 1.0.0
servers:
  - url: /api
paths:
  /guias/competencias:
    get:
      security: [{ bearerAuth: [] }]
      summary: Lista competencias de guias
      responses:
        '200': { description: Competencias retornadas }
  /guias/status-escolas:
    get:
      security: [{ bearerAuth: [] }]
      summary: Lista status de escolas
      responses:
        '200': { description: Status retornados }
  /guias/romaneio:
    get:
      security: [{ bearerAuth: [] }]
      summary: Lista romaneio
      responses:
        '200':
          description: Romaneio retornado
          content:
            application/json:
              example: [{ guia_id: 21, escola_nome: "EMEF Alice Fanjas", itens: 2 }]
  /guias:
    get:
      security: [{ bearerAuth: [] }]
      summary: Lista guias
      responses:
        '200': { description: Guias retornadas }
    post:
      security: [{ bearerAuth: [] }]
      summary: Cria guia
      requestBody:
        required: true
        content:
          application/json:
            example: { nome: "Guia Abril", competencia_mes_ano: "2026-04" }
      responses:
        '201': { description: Guia criada }
  /guias/{id}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Busca guia
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Guia retornada }
    put:
      security: [{ bearerAuth: [] }]
      summary: Atualiza guia
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            example: { observacoes: "Ajuste manual" }
      responses:
        '200': { description: Guia atualizada }
    delete:
      security: [{ bearerAuth: [] }]
      summary: Remove guia
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Guia removida }
  /guias/geracao-demanda:
    post:
      security: [{ bearerAuth: [] }]
      summary: Gera guia de demanda de forma sincrona
      requestBody:
        required: true
        content:
          application/json:
            example: { competencia_mes_ano: "2026-05", escolas: [115, 121] }
      responses:
        '200': { description: Guia gerada }
  /guias/geracao-demanda/async:
    post:
      security: [{ bearerAuth: [] }]
      summary: Inicia geracao assincrona
      requestBody:
        required: true
        content:
          application/json:
            example: { competencia_mes_ano: "2026-05" }
      responses:
        '202':
          description: Job iniciado
          content:
            application/json:
              example: { job_id: "job-123" }
  /guias/geracao-demanda/jobs/{id}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Consulta status do job de guia
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Status retornado
          content:
            application/json:
              example: { job_id: "job-123", status: "completed" }
  /guias/{guiaId}/produtos:
    get:
      security: [{ bearerAuth: [] }]
      summary: Lista produtos da guia
      parameters: [{ name: guiaId, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Produtos retornados }
    post:
      security: [{ bearerAuth: [] }]
      summary: Adiciona produto a guia
      parameters: [{ name: guiaId, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            example: { produto_id: 31, escola_id: 115, quantidade: 20 }
      responses:
        '201': { description: Produto adicionado }
  /guias/{guiaId}/itens:
    get:
      security: [{ bearerAuth: [] }]
      summary: Lista itens da guia
      parameters: [{ name: guiaId, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Itens retornados }
  /compras:
    get:
      security: [{ bearerAuth: [] }]
      summary: Lista compras
      responses:
        '200': { description: Compras retornadas }
    post:
      security: [{ bearerAuth: [] }]
      summary: Cria compra
      requestBody:
        required: true
        content:
          application/json:
            example:
              fornecedor_id: 9
              itens:
                - { contrato_produto_id: 88, quantidade: 100, preco_unitario: 6.9 }
      responses:
        '201': { description: Compra criada }
  /compras/gerar-da-guia:
    post:
      security: [{ bearerAuth: [] }]
      summary: Gera compra a partir da guia
      requestBody:
        required: true
        content:
          application/json:
            example: { guia_id: 21 }
      responses:
        '200': { description: Compra gerada/validada }
  /compras/gerar-da-guia/async:
    post:
      security: [{ bearerAuth: [] }]
      summary: Inicia job assincrono de compra da guia
      requestBody:
        required: true
        content:
          application/json:
            example: { guia_id: 21 }
      responses:
        '202':
          description: Job iniciado
          content:
            application/json:
              example: { job_id: "job-789" }
  /compras/jobs/{id}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Consulta job de compra
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Job retornado }
  /compras/{id}/resumo-tipo-fornecedor:
    get:
      security: [{ bearerAuth: [] }]
      summary: Resumo por tipo de fornecedor
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Resumo retornado }
  /compras/itens/{pedido_item_id}/programacoes:
    get:
      security: [{ bearerAuth: [] }]
      summary: Lista programacoes do item
      parameters: [{ name: pedido_item_id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Programacoes retornadas }
    put:
      security: [{ bearerAuth: [] }]
      summary: Salva programacoes do item
      parameters: [{ name: pedido_item_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              - data_entrega: "2026-05-05"
                escolas:
                  - { escola_id: 115, quantidade: 20 }
      responses:
        '200': { description: Programacoes salvas }
  /planejamento-compras/calcular-por-competencia:
    post:
      security: [{ bearerAuth: [] }]
      summary: Calcula demanda por competencia
      requestBody:
        required: true
        content:
          application/json:
            example: { competencia_mes_ano: "2026-05" }
      responses:
        '200': { description: Demanda calculada }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
