openapi: 3.0.3
info:
  title: Estoque e Entregas API
  version: 1.0.0
servers:
  - url: /api
paths:
  /estoque-central:
    get:
      security: [{ bearerAuth: [] }]
      summary: Lista estoque central
      responses:
        '200':
          description: Estoque retornado
          content:
            application/json:
              example: [{ produto_id: 31, produto_nome: "Arroz", quantidade_total: 100, quantidade_disponivel: 85, quantidade_reservada: 15 }]
  /estoque-central/movimentacoes:
    get:
      security: [{ bearerAuth: [] }]
      summary: Lista movimentacoes centrais
      responses:
        '200':
          description: Timeline retornada
          content:
            application/json:
              example: [{ id: 1, tipo_evento: "transferencia_para_escola", quantidade_movimentada: -15 }]
  /estoque-central/entrada:
    post:
      security: [{ bearerAuth: [] }]
      summary: Registra entrada central
      requestBody:
        required: true
        content:
          application/json:
            example: { produtoId: 31, quantidade: 100, motivo: "Recebimento", referencia_tipo: "pedido_item", referencia_id: 501 }
      responses:
        '201': { description: Evento criado }
  /estoque-central/saida:
    post:
      security: [{ bearerAuth: [] }]
      summary: Registra saida central
      requestBody:
        required: true
        content:
          application/json:
            example: { produtoId: 31, quantidade: 20, motivo: "Perda" }
      responses:
        '201': { description: Evento criado }
  /estoque-central/ajuste:
    post:
      security: [{ bearerAuth: [] }]
      summary: Registra ajuste central
      requestBody:
        required: true
        content:
          application/json:
            example: { produtoId: 31, quantidade: 85, motivo: "Contagem fisica" }
      responses:
        '201': { description: Evento criado }
  /estoque-central/transferencias:
    post:
      security: [{ bearerAuth: [] }]
      summary: Transfere para escola
      requestBody:
        required: true
        content:
          application/json:
            example: { escola_id: 115, produto_id: 31, quantidade: 15, motivo: "Abastecimento da escola" }
      responses:
        '201':
          description: Transferencia registrada
          content:
            application/json:
              example:
                central_evento: { id: 101, quantidade_delta: -15 }
                escola_evento: { id: 102, quantidade_delta: 15 }
  /estoque-escolar/escolas/{escolaId}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Lista saldo escolar
      parameters: [{ name: escolaId, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: Saldo retornado
          content:
            application/json:
              example: [{ produto_id: 31, produto_nome: "Arroz", quantidade_atual: 15 }]
  /estoque-escolar/escolas/{escolaId}/movimentacoes:
    post:
      security: [{ bearerAuth: [] }]
      summary: Registra movimentacao escolar
      parameters: [{ name: escolaId, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            example: { produtoId: 31, tipoMovimentacao: "saida", quantidade: 5, motivo: "Consumo" }
      responses:
        '201': { description: Evento criado }
  /entregas/escolas:
    get:
      security: [{ bearerAuth: [] }]
      summary: Lista escolas para entrega
      responses:
        '200':
          description: Escolas retornadas
          content:
            application/json:
              example: [{ escola_id: 115, escola_nome: "EMEF Alice Fanjas", total_itens: 2, entregues: 2, pendentes: 0 }]
  /entregas/offline-bundle:
    get:
      security: [{ bearerAuth: [] }]
      summary: Retorna bundle offline
      responses:
        '200':
          description: Bundle retornado
          content:
            application/json:
              example: { generated_at: "2026-04-29T20:00:00Z", escolas: [], itens: [] }
  /entregas/itens/{itemId}/confirmar:
    post:
      security: [{ bearerAuth: [] }]
      summary: Confirma entrega
      parameters: [{ name: itemId, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              quantidade_entregue: 10
              nome_quem_entregou: "Carlos"
              nome_quem_recebeu: "Maria"
              observacao: "Entrega parcial"
              latitude: -1.35
              longitude: -48.24
              client_operation_id: "offline-001"
      responses:
        '200':
          description: Entrega confirmada
          content:
            application/json:
              example: { message: "Entrega confirmada com sucesso", historico_id: 9001 }
  /entregas/comprovantes:
    get:
      security: [{ bearerAuth: [] }]
      summary: Lista comprovantes
      responses:
        '200': { description: Comprovantes retornados }
    post:
      security: [{ bearerAuth: [] }]
      summary: Cria comprovante
      requestBody:
        required: true
        content:
          application/json:
            example:
              escola_id: 115
              itens:
                - { item_id: 301, quantidade: 10 }
      responses:
        '201': { description: Comprovante criado }
  /entregas/comprovantes/{id}/foto/upload-url:
    post:
      security: [{ bearerAuth: [] }]
      summary: Solicita upload URL para foto
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            example: { contentType: "image/jpeg", sizeBytes: 250000 }
      responses:
        '200':
          description: URL assinada retornada
          content:
            application/json:
              example:
                url: "https://storage.example/upload"
                path: "entregas/comprovantes/9/uuid.jpg"
                headers: { Content-Type: "image/jpeg" }
  /entregas/comprovantes/{id}/foto/confirmar:
    post:
      security: [{ bearerAuth: [] }]
      summary: Confirma upload da foto
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            example: { storageKey: "entregas/comprovantes/9/uuid.jpg" }
      responses:
        '200': { description: Upload confirmado }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
