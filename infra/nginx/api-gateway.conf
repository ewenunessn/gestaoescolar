# NutriLog API Gateway reference config.
# Replace `backend:3000` with the upstream service name/address used in production.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=120r/m;
limit_req_zone $http_authorization zone=user_limit:10m rate=1000r/15m;

upstream nutrilog_backend {
  server backend:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name api.example.com;

  client_max_body_size 10m;
  proxy_read_timeout 75s;
  proxy_send_timeout 75s;

  location = /health {
    proxy_pass http://nutrilog_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /bff/ {
    limit_req zone=ip_limit burst=60 nodelay;
    limit_req zone=user_limit burst=120 nodelay;

    proxy_pass http://nutrilog_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
  }

  location /api/ {
    limit_req zone=ip_limit burst=60 nodelay;
    limit_req zone=user_limit burst=120 nodelay;

    proxy_pass http://nutrilog_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location /socket.io/ {
    limit_req zone=ip_limit burst=60 nodelay;

    proxy_pass http://nutrilog_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location /uploads/ {
    proxy_pass http://nutrilog_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
